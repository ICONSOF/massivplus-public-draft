title: MASSIV+
description: Öppen standard för utsläppsdata i värdekedjor
url: https://docs.massivplus.org

# Dokumentationstema (just-the-docs). Pinnad version för GitHub Pages
# klassiska bygge (Jekyll 3.10). Bumpa vid behov.
remote_theme: just-the-docs/just-the-docs@v0.10.1

# Grön färgprofil (matchar loggan) - definierad i _sass/color_schemes/massiv.scss
color_scheme: massiv

# Snygga URL:er utan .html (behåller befintliga adresser som /introduktion/)
permalink: pretty

# Sök (inbyggd i temat)
search_enabled: true
search:
  heading_level: 2
  previews: 3

# Logga överst i sidomenyn
logo: "/assets/img/massivplus-logo-green.png"

# Externa länkar uppe till höger
aux_links:
  "GitHub": "https://github.com/ICONSOF/massivplus-public-draft"
  "Discussions": "https://github.com/ICONSOF/massivplus-public-draft/discussions"
aux_links_new_tab: true

# "Föreslå en ändring"-länk i sidfoten på varje sida
gh_edit_link: true
gh_edit_link_text: "Föreslå en ändring på den här sidan"
gh_edit_repository: "https://github.com/ICONSOF/massivplus-public-draft"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

# Sidfotstext - Vinnova-erkännande enligt villkoren, syns på varje sida
footer_content: "Detta arbete utförs med stöd från Vinnova (Sweden's Innovation Agency) inom programmet Avancerad digitalisering."
